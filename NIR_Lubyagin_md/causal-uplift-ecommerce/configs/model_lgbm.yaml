# Гиперпараметры base learners (W1, SPEC §4.1).
# Файл подключается оверлеем поверх секции `model` из config.yaml:
#   make train CONFIG=configs/config.yaml MODEL_CONFIG=configs/model_lgbm.yaml
# Обоснование значений и сетка для подбора — docs/hyperparameters.md.
lgbm:
  n_estimators: 500
  learning_rate: 0.05
  num_leaves: 31
  min_child_samples: 50
  early_stopping_rounds: 50
  subsample: 0.9
  subsample_freq: 1
  colsample_bytree: 0.9
  reg_lambda: 1.0
  verbose: -1

propensity:
  n_estimators: 300
  learning_rate: 0.05
  num_leaves: 15
  min_child_samples: 100
  early_stopping_rounds: 50
  verbose: -1

xlearner:
  cross_fitting_folds: 5
  propensity_clip: [0.01, 0.99]
  backend: native
